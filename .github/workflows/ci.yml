name: CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  verify-and-boot:
    name: Verify + boot smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JOE
        uses: actions/checkout@v4

      # JOE's kernel is written entirely in Curlee -- the compiler is a
      # separate project (github.com/w4ffl35/curlee) that must be built
      # from source. scripts/find-curlee.sh resolves it via $CURLEE_ROOT
      # (checked below) before falling back to ~/Projects/curlee or PATH.
      - name: Checkout Curlee
        uses: actions/checkout@v4
        with:
          repository: w4ffl35/curlee
          path: curlee

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ gcc libz3-dev pkg-config qemu-system-x86 grub-pc-bin xorriso mtools

      - name: Build Curlee compiler
        working-directory: curlee
        run: |
          cmake --preset linux-debug
          cmake --build --preset linux-debug

      - name: Static verify gates (check, VM tests, C-boundary, kernel build)
        env:
          CURLEE: ${{ github.workspace }}/curlee/build/linux-debug/curlee
        run: make verify

      - name: Boot smoke (QEMU, primary path)
        env:
          CURLEE: ${{ github.workspace }}/curlee/build/linux-debug/curlee
        run: make qemu-smoke

      - name: Framebuffer smoke (QEMU)
        env:
          CURLEE: ${{ github.workspace }}/curlee/build/linux-debug/curlee
        run: make qemu-fb-smoke

      - name: Network stack smoke (QEMU, socket-based two-instance gate)
        env:
          CURLEE: ${{ github.workspace }}/curlee/build/linux-debug/curlee
        run: make qemu-net-smoke

      # qemu-llm-smoke is NOT wired into CI: it requires a real LLM daemon
      # reachable from the guest (scripts/run-llm-smoke.sh), which CI has no
      # way to provide. Run it locally via `make qemu-llm-smoke` before
      # relying on it for a change that touches the LLM bridge path.
